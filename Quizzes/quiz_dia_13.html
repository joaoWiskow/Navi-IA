<script>
const QUIZ = {

    },
    {
      "tipo": "vf",
      "enunciado": "Em um loop de agente, quem decide que o trabalho acabou é o modelo: quando ele responde sem nenhum `function_call`.",

    {
      "tipo": "completar",
      "enunciado": "Para evitar loops infinitos, definimos um teto de iterações chamado `max______`.",
      "respostas": [
        "iterations",
        "iteration"
      ],
      "explicacao": "É o `max_iterations` (5 nos nossos exemplos): depois dele o loop encerra e avisa o usuário, em vez de gastar cota sem parar."

      "tipo": "multipla",

        "Reiniciar o programa"

      "correta": 1,

    },
    {
      "tipo": "multipla",

        "Porque o histórico acumulado (chamadas e resultados) é reenviado inteiro a cada chamada ao modelo",

        "Porque o SDK duplica as mensagens"
      ],
      "correta": 1,
      "explicacao": "A API é sem estado: todo o contexto precisa ser reenviado. Agentes longos ficam caros e lentos, e é por isso que medimos a telemetria. Não é verbosidade (primeira), tamanho de ferramenta (terceira) nem duplicação pelo SDK (quarta)."
    },
    {
      "tipo": "vf",
      "enunciado": "Frameworks como LangChain ou CrewAI são obrigatórios para construir um agente com loop de ferramentas.",

    {

        "Resposta final em texto"
      ],
      "explicacao": "Cada ferramenta depende da saída da anterior: por isso o agente precisa de vários turnos e não consegue resolver tudo de uma vez."

    {

      "explicacao": "Ele permite implementar guardas (repetição, limites, segurança) sem alterar o núcleo do loop. Formatar (primeira), contar tokens (terceira, feito por `ao_fim_do_turno`) e traduzir (quarta) são outras responsabilidades."

    {
      "tipo": "multipla",

        "O número de ferramentas instaladas"
      ],
      "correta": 1,
      "explicacao": "Sem medir, não dá para saber onde o agente gasta tempo e dinheiro. Só o tempo total (primeira) esconde os gargalos; temperatura (terceira) e ferramentas instaladas (quarta) não são métricas de execução do loop."

    {
      "tipo": "associar",
      "enunciado": "Associe cada controle à falha que ele previne:",

        [
          "Telemetria por turno",
          "Custo e latência invisíveis"
        ]
      ],
      "explicacao": "Cada guarda cobre um modo de falha distinto; em produção, todos convivem."

    {
      "tipo": "vf",
      "enunciado": "Quando o modelo pede duas ferramentas independentes no mesmo turno, o loop deve executar as duas e devolver **os dois** resultados antes de chamar o modelo de novo.",

      "explicacao": "Verdadeiro. O modelo espera um `function_response` para cada `function_call` do turno; devolver só um deixa o histórico inconsistente."

      "correta": 1,

      "correta": 1,
      "explicacao": "O host é a aplicação (para nós, o script com o Gemini) que abriga um ou mais clientes MCP. O servidor (primeira) é quem expõe as capacidades; banco e nuvem (terceira e quarta) não são papéis do protocolo."
    },
    {
      "tipo": "multipla",
      "enunciado": "Qual formato de mensagem o MCP usa?",
      "opcoes": [

    },
    {
      "tipo": "completar",
      "enunciado": "No transporte `stdio`, o servidor é iniciado como um processo ______ do cliente.",
      "respostas": [
        "filho"

      "explicacao": "O cliente inicia o servidor como processo filho e as mensagens trafegam pela entrada e saída padrão, sem portas de rede."

        "`ping`"

      "correta": 1,
